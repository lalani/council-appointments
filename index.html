<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council Appointments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="sidebar">
        <div class="logo">
            <h2>Ismaili Council</h2>
            <p>Southeastern USA</p>
        </div>

        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search name or board..." onkeyup="filterContent()">
        </div>

        <ul id="nav-list">
        </ul>
    </nav>

    <main id="main-content">
        <header>
            <h1>Institutional Appointments</h1>
            <p class="term-date">Term: July 11, 2024 - July 11, 2025</p>
        </header>

        <div id="dynamic-content">
            <div style="text-align: center; padding-top: 50px; color: #666;">
                <p>Loading appointments...</p>
            </div>
        </div>

        <div style="height: 300px;"></div> 
    </main>

    <script src="script.js"></script>
</body>
</html>
